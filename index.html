<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Convert your money easily</p>

        <div class="converter">

            <label>Enter Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" value="1" min="0">

            <div class="currency-box">
                <div>
                    <label>From</label>
                    <select id="fromCurrency">
                        <option value="USD">USD</option>
                        <option value="INR">INR</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                    </select>
                </div>

                <button id="swapBtn" type="button">⇄</button>

                <div>
                    <label>To</label>
                    <select id="toCurrency">
                        <option value="INR">INR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                    </select>
                </div>
            </div>

            <button id="convertBtn">Convert Currency</button>

            <div class="result">
                <p>Converted Amount</p>
                <h2 id="result">Result will appear here</h2>
            </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
